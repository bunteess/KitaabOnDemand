name: Release

# On a version tag (v1.2.3): build the server images and push them to GitHub's
# container registry, and build the Android App Bundle. Nothing is deployed:
# docs/DEPLOY.md and docs/RELEASE_MOBILE.md describe the next steps.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  # Docker Hub rate-limits anonymous pulls from shared runners (D-005).
  DOCKER_REGISTRY: mirror.gcr.io
  FLUTTER_VERSION: "3.47.7"

jobs:
  images:
    name: Image ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: api, file: infra/docker/api.Dockerfile, target: api }
          - { name: worker, file: infra/docker/api.Dockerfile, target: worker }
          - { name: beat, file: infra/docker/api.Dockerfile, target: beat }
          - { name: web, file: infra/docker/web.Dockerfile, target: runtime }
    steps:
      - uses: actions/checkout@v5
      - name: Image name
        id: image
        # Registry names must be lower case.
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/kitaabondemand-${{ matrix.name }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          build-args: DOCKER_REGISTRY=${{ env.DOCKER_REGISTRY }}
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Summary
        run: echo "Pushed ${{ steps.image.outputs.name }}:${{ github.ref_name }}" >> "$GITHUB_STEP_SUMMARY"

  android:
    name: Android App Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      # The tag names the version; pubspec.yaml carries it plus the build
      # number Google Play needs to increase on every upload.
      - name: Tag matches pubspec.yaml
        run: |
          version=$(sed -n 's/^version: *\([0-9.]*\)+[0-9]*$/\1/p' apps/mobile/pubspec.yaml)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pubspec.yaml version $version"
            exit 1
          fi
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Upload key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No upload key secrets: the bundle is debug-signed and Google Play will refuse it"
            exit 0
          fi
          if grep -q 'example\.pk' apps/mobile/config/prod.json; then
            echo "::error::apps/mobile/config/prod.json still has placeholder values (docs/RELEASE_MOBILE.md)"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
          {
            echo "storeFile=$RUNNER_TEMP/upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > apps/mobile/android/key.properties
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - name: Build (prod flavor)
        run: make mobile-build FLAVOR=prod STRICT=1
      - name: Remove the upload key
        if: always()
        run: rm -f apps/mobile/android/key.properties "$RUNNER_TEMP/upload-keystore.jks"
      - name: Summary
        run: |
          aab=$(ls apps/mobile/build/app/outputs/bundle/prodRelease/*.aab)
          bytes=$(stat -c %s "$aab")
          echo "App Bundle ${GITHUB_REF_NAME}: $bytes bytes ($(numfmt --to=iec "$bytes")), signed for Play: ${{ steps.signing.outputs.signed }}" \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: kitaabondemand-${{ github.ref_name }}-aab
          path: apps/mobile/build/app/outputs/bundle/prodRelease/*.aab
          retention-days: 90
