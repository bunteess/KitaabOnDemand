# Production on one server (docs/DEPLOY.md). Images come from the release
# workflow; settings from infra/.env.production (never committed). Files live
# in S3 (infra/terraform), so there is no MinIO here.
#
#   docker compose -f infra/docker-compose.prod.yml --env-file infra/.env.production up -d
#
# Only Caddy publishes ports. It terminates TLS with automatic certificates and
# forwards to the API and the portal on the internal network.

x-api: &api
  image: ${IMAGE_PREFIX:-ghcr.io/bunteess/kitaabondemand}-api:${VERSION:?set VERSION}
  # PROD_ENV_FILE lets `make infra-check` validate against the example file.
  env_file: ${PROD_ENV_FILE:-.env.production}
  restart: unless-stopped
  networks: [internal]
  volumes:
    # Firebase service account for push notifications (docs/DEPLOY.md).
    - ${FCM_CREDENTIALS_HOST_FILE:-./secrets/fcm-service-account.json}:/run/secrets/fcm-service-account.json:ro
  logging: &logging
    driver: json-file
    options:
      max-size: "20m"
      max-file: "10"

services:
  caddy:
    image: ${DOCKER_REGISTRY:-docker.io}/library/caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN}
      PORTAL_DOMAIN: ${PORTAL_DOMAIN:?set PORTAL_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api, web]
    networks: [internal]
    logging: *logging

  migrate:
    <<: *api
    image: ${IMAGE_PREFIX:-ghcr.io/bunteess/kitaabondemand}-api:${VERSION:?set VERSION}
    command: ["kitaab", "migrate"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *api
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    <<: *api
    image: ${IMAGE_PREFIX:-ghcr.io/bunteess/kitaabondemand}-worker:${VERSION:?set VERSION}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  beat:
    <<: *api
    image: ${IMAGE_PREFIX:-ghcr.io/bunteess/kitaabondemand}-beat:${VERSION:?set VERSION}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  clamav:
    image: ${DOCKER_REGISTRY:-docker.io}/clamav/clamav:stable
    restart: unless-stopped
    networks: [internal]
    volumes:
      - clamav:/var/lib/clamav
    logging: *logging

  web:
    image: ${IMAGE_PREFIX:-ghcr.io/bunteess/kitaabondemand}-web:${VERSION:?set VERSION}
    restart: unless-stopped
    environment:
      API_UPSTREAM: api:8000
    depends_on: [api]
    networks: [internal]
    logging: *logging

  postgres:
    image: ${DOCKER_REGISTRY:-docker.io}/library/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kitaab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-kitaab}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]
    logging: *logging

  redis:
    image: ${DOCKER_REGISTRY:-docker.io}/library/redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]
    logging: *logging

  # A compressed pg_dump every day at about 02:00 Pakistan time, kept on the
  # server for BACKUP_KEEP_DAYS and copied to S3 by backup-ship (docs/RUNBOOK.md).
  backup:
    image: ${DOCKER_REGISTRY:-docker.io}/library/postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-kitaab}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-kitaab}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      TZ: Asia/Karachi
    volumes:
      - ./backup/backup.sh:/usr/local/bin/backup.sh:ro
      - ${BACKUP_DIR:-./backups}:/backups
    entrypoint: ["/bin/sh", "/usr/local/bin/backup.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]
    logging: *logging

  # Uploads new dumps to the backup bucket every hour (infra/terraform/backups.tf).
  backup-ship:
    image: ${DOCKER_REGISTRY:-docker.io}/amazon/aws-cli:2.31.18
    restart: unless-stopped
    environment:
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      AWS_REGION: ${S3_REGION:-ap-south-1}
      AWS_ACCESS_KEY_ID: ${BACKUP_AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_AWS_SECRET_ACCESS_KEY:-}
    volumes:
      - ./backup/ship.sh:/usr/local/bin/ship.sh:ro
      - ${BACKUP_DIR:-./backups}:/backups:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/ship.sh"]
    networks: [internal]
    logging: *logging

networks:
  internal: {}

volumes:
  pgdata: {}
  redisdata: {}
  caddy_data: {}
  caddy_config: {}
  clamav: {}
